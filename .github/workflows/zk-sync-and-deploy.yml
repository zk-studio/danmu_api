name: Sync and Deploy

on:
  push:
    branches:
      - main
  schedule:
    # 每天北京时间早上 8 点自动同步更新 (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 如果是由定时任务（schedule）或手动触发（workflow_dispatch）触发，执行同步
      - name: Sync from Upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 添加原作者仓库为 upstream
          git remote add upstream https://github.com/huangxd-/danmu_api.git
          git fetch upstream
          
          # 检测是否有新代码
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          
          if [ "$LOCAL_HASH" != "$UPSTREAM_HASH" ]; then
            echo "New updates found in upstream! Merging..."
            # 合并原作者代码，并自动提交
            git merge upstream/main -m "Merge upstream updates" --allow-unrelated-histories
            
            # 推送合并后的代码回用户仓库
            git push origin HEAD:${{ github.ref }}
            echo "sync_updated=true" >> $GITHUB_ENV
          else
            echo "No updates found in upstream."
            echo "sync_updated=false" >> $GITHUB_ENV
          fi

      # 决定是否进行部署：
      # 1. 只要是 push 触发，直接部署
      # 2. 如果是 schedule/workflow_dispatch，且有新代码更新，才进行部署
      - name: Determine if deploy is needed
        id: deploy_check
        run: |
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ env.sync_updated }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.deploy_check.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.deploy_check.outputs.should_deploy == 'true'
        run: npm install

      - name: Deploy to Cloudflare Workers
        if: steps.deploy_check.outputs.should_deploy == 'true'
        run: npx wrangler deploy --api-token ${{ secrets.CLOUDFLARE_API_TOKEN }}
